spring.application.name=networth-tracker
spring.datasource.url=jdbc:postgresql://localhost:5433/networthtracker
spring.datasource.username=networth
spring.datasource.password=networth_dev_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8080

# JWT
jwt.secret=super-secret-dev-key-change-in-production
jwt.access-token-expiration=900000
# FX rates (PRD 4.5.2): USD-based open feed, fetched daily at 01:00 UTC and at
# startup when today's set is missing. false = never fetch (tests, offline).
moneta.fx.enabled=true
moneta.fx.url=https://open.er-api.com/v6/latest/USD

# Currencies a user may pick as their preferred currency (PRD 4.5.4). Adding
# VND, JPY or KRW is a change here, not a migration.
moneta.currencies.display=AUD,USD
