services:
  postgres:
    image: postgres:16-alpine
    container_name: networth-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: networthtracker
      POSTGRES_USER: networth
      POSTGRES_PASSWORD: networth_dev_pass
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: